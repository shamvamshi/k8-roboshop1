apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-configmap
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      component: user
      environment: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: user
        environment: backend
    spec:
      containers:
      - name: cart
        image: sham6779/cart
        envFrom:
        - configMapRef:
            name: cart-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
spec:
  type: ClusterIP
  selector:
    labels:
      project: roboshop
      component: user
      environment: backend
  ports:
  - name: cart
    protocol: TCP
    port: 8080
    targetPort: 8080