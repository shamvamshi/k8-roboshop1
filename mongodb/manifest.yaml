apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    project: roboshop
    component: mongodb
    environment: database
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      environment: database
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        environment: database
    spec:
      containers:
      - name: mongodb
        image: sham6779/mongodb:v1
        ports:
        - containerPort: 27017
---
