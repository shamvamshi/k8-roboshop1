#     tier: web
# data:
#   MONGO: "true"
#   MONGO_URL: "mongodb://mongodb:27017/frontend"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: frontend
      tier: web
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: sham6779/frontend:v1
        # envFrom:
        # - configMapRef:
        #     name: configmap-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: web
spec:
  type: LoadBalancer  # Defines the exposure type
  selector:
    project: roboshop
    component: frontend
    tier: web  # Finds all Pods with the label "tier: secure-web"
  ports:
  - protocol: TCP
    port: 80       # The stable port exposed by this Service
    targetPort: 80 # The internal container port receiving the traffic

