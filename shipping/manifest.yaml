apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    environment: backend
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-deployment
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    environment: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: shipping
      environment: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: shipping
        environment: backend
    spec:
      containers:
      - name: shipping
        image: sham6779/shipping:v1
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shipping
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: roboshop
spec:
  selector:
    labels:
      project: roboshop
      component: shipping
      environment: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
