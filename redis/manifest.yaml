apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    environment: database
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: redis
      environment: database
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        environment: database
    spec:
      containers:
      - name: redis
        image: redis:7.0
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    environment: database
spec:
  type: ClusterIP  # Defines the exposure type
  selector:
    project: roboshop
    component: redis
    environment: database  # Finds all Pods with the label "app: secure-web"
  ports:
  - protocol: TCP
    port: 6379         # The stable port exposed by this Service
    targetPort: 6379 # The internal container port receiving the traffic

