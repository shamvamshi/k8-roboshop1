apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    environment: backend
data:
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    environment: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: catalogue
      environment: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: catalogue
        environment: backend
    spec:
      containers:
      - name: catalogue
        image: sham6779/catalogue:v1
        envFrom:
        - configMapRef:
            name: configmap-catalogue
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: roboshop
  labels:
    project: roboshop
    component: catalogue
    environment: backend
spec:
  type: ClusterIP  # Defines the exposure type
  selector:
    project: roboshop
    component: catalogue
    environment: backend  # Finds all Pods with the label "app: secure-web"
  ports:
  - protocol: TCP
    port: 8080         # The stable port exposed by this Service
    targetPort: 8080 # The internal container port receiving the traffic

