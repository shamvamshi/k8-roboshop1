apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    environment: database
type: Opaque
data:
  RABBITMQ_DEFAULT_USER: cm9ib3Nob3A=
  RABBITMQ_DEFAULT_PASS: cm9ib3Nob3AxMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    environment: database
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: rabbitmq
      environment: database
  template:
    metadata:
      labels:
        project: roboshop
        component: rabbitmq
        environment: database
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3
        envFrom:
        - secretRef:
            name: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    environment: database
spec:
  selector:
    project: roboshop
    component: rabbitmq
    environment: database
  ports:
  - name: rabbitmq
    protocol: TCP
    port: 5672
    targetPort: 5672
