apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    environment: database
type: Opaque
Data:
  MYSQL_ROOT_PASSWORD: Um9ib1Nob3BAMQ==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    environment: database
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      environment: database
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        environment: database
    spec:
      containers:
      - name: mysql
        image: sham6779/mysql:v1
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:
            name: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    environment: database
spec:
  selector:
    project: roboshop
    component: mysql
    environment: database
  ports:
  - name: mysql
    protocol: TCP
    port: 3306
    targetPort: 3306
