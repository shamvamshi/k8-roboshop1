apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
data:
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users" 
  MONGO: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: user
      environment: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: user
        environment: backend
    spec:
      containers:
      - name: user
        image: sham6779/user:v1
        envFrom:
        - configMapRef:
            name: configmap-user
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    environment: backend
spec:
  type: ClusterIP  # Defines the exposure type
  selector:
    project: roboshop
    component: user
    environment: backend  # Finds all Pods with the label "app: secure-web"
  ports:
  - protocol: TCP
    port: 8080         # The stable port exposed by this Service
    targetPort: 8080 # The internal container port receiving the traffic

